<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages & Enquiries | Frame & Fable Admin</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { charcoal: '#102A43', ivory: '#F8ECD6', accent: '#D69D30' } },
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Early Theme & RTL Restore Script to prevent FOUC -->
  <script>
    (function() {
      const theme = localStorage.getItem('studioTheme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const rtl = localStorage.getItem('studioRTL');
      if (rtl === 'rtl' || rtl === 'true') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    })();
  </script>
</head>
<body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 min-h-screen flex flex-col md:flex-row">

  <!-- SIDEBAR -->
  <aside id="dashboard-sidebar" class="dashboard-sidebar fixed md:sticky top-0 z-40 w-64 h-screen bg-brand-charcoal text-neutral-300 border-r border-neutral-800 flex flex-col justify-between p-6 transform -translate-x-full md:translate-x-0 rtl:translate-x-full rtl:md:translate-x-0 transition-transform duration-300">
    <div>
      <a href="index.html" class="flex items-center gap-3 pb-8 border-b border-neutral-800">
        <div class="w-9 h-9 bg-brand-ivory text-brand-charcoal flex items-center justify-center rounded-full font-serif font-bold text-lg">F</div>
        <div class="flex flex-col">
          <span class="font-serif text-lg tracking-wider font-semibold text-white uppercase">Frame & Fable</span>
          <span class="text-[9px] tracking-[0.2em] text-amber-400 uppercase font-mono">Admin Portal</span>
        </div>
      </a>

      <nav class="mt-8 space-y-1.5" aria-label="Dashboard Sidebar">
        <a href="dashboard.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-md text-sm font-medium hover:bg-neutral-800 hover:text-white transition-colors">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
        </a>
        <a href="dashboard-bookings.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-md text-sm font-medium hover:bg-neutral-800 hover:text-white transition-colors">
          <i data-lucide="calendar" class="w-4 h-4"></i> Bookings
        </a>
        <a href="dashboard-portfolio.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-md text-sm font-medium hover:bg-neutral-800 hover:text-white transition-colors">
          <i data-lucide="image" class="w-4 h-4"></i> Portfolio
        </a>
        <a href="dashboard-messages.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-md text-sm font-medium bg-neutral-800 text-white border-l-4 border-amber-500 rtl:border-l-0 rtl:border-r-4">
          <i data-lucide="mail" class="w-4 h-4 text-amber-500"></i> Messages / Enquiries
        </a>
        <a href="dashboard-settings.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-md text-sm font-medium hover:bg-neutral-800 hover:text-white transition-colors">
          <i data-lucide="settings" class="w-4 h-4"></i> Settings
        </a>
        <a href="index.html" class="flex items-center gap-3 px-3.5 py-2.5 rounded-md text-sm font-medium hover:bg-neutral-800 hover:text-white transition-colors text-neutral-400 pt-4 border-t border-neutral-800">
          <i data-lucide="globe" class="w-4 h-4"></i> View Live Website
        </a>
      </nav>
    </div>

    <div class="pt-6 border-t border-neutral-800 space-y-3">
      <div class="flex items-center justify-between">
        <span class="text-xs text-neutral-400 font-mono">Theme & Layout</span>
        <div class="flex items-center gap-2">
          <button type="button" class="theme-toggle-btn w-8 h-8 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 flex items-center justify-center transition-colors" aria-label="Toggle theme" title="Toggle theme">
            <i data-lucide="sun" class="theme-sun w-4 h-4 hidden"></i>
            <i data-lucide="moon" class="theme-moon w-4 h-4"></i>
          </button>
          <button type="button" class="rtl-toggle-btn w-8 h-8 rounded-lg bg-neutral-800 text-neutral-300 hover:bg-neutral-700 flex items-center justify-center transition-colors" aria-label="Toggle RTL" title="Toggle RTL">
            <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      <a href="index.html" class="flex items-center gap-2 text-xs font-medium text-rose-400 hover:text-rose-300">
        <i data-lucide="log-out" class="w-4 h-4"></i> Logout Admin
      </a>
    </div>
  </aside>

  <div id="dashboard-sidebar-overlay" class="fixed inset-0 bg-black/60 z-30 hidden md:hidden"></div>

  <div class="flex-1 flex flex-col min-w-0">

    <!-- Top Bar -->
    <header class="bg-white dark:bg-neutral-900 border-b border-neutral-200 dark:border-neutral-800 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
      <div class="flex items-center gap-4">
        <button type="button" id="dashboard-sidebar-toggle" class="p-2 text-neutral-600 dark:text-neutral-300 md:hidden">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
        <h1 class="text-xl font-serif font-medium text-neutral-900 dark:text-neutral-100">Enquiries Inbox</h1>
      </div>
    </header>

    <main class="p-6 sm:p-8 space-y-6 flex-1">

      <div class="bg-white dark:bg-neutral-900 border border-neutral-200 dark:border-neutral-800 rounded-xl overflow-hidden shadow-sm">
        <div id="messages-list" class="divide-y divide-neutral-100 dark:divide-neutral-800">
          <!-- Rendered dynamically via assets/js/dashboard-messages.js -->
        </div>
      </div>

    </main>

    <footer class="mt-auto py-6 px-6 border-t border-neutral-200 dark:border-neutral-800 text-xs text-neutral-500 flex flex-col sm:flex-row justify-between items-center gap-4">
      <div class="flex flex-col sm:flex-row items-center gap-2 text-center sm:text-left rtl:sm:text-right">
        <p>&copy; 2026 Frame & Fable Studio. All rights reserved.</p>
        <span class="hidden sm:inline text-neutral-300 dark:text-neutral-700">•</span>
        <p class="text-neutral-500 dark:text-neutral-400">Developed by Abhivorn Technologies Pvt. Ltd.</p>
      </div>
      <div class="flex items-center gap-4">
        <a href="index.html" class="hover:text-amber-500 transition-colors">View Main Site</a>
      </div>
    </footer>
  </div>

  <!-- MESSAGE DETAIL MODAL -->
  <div id="message-detail-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/70 backdrop-blur-sm p-4">
    <div class="bg-white dark:bg-neutral-900 max-w-lg w-full p-6 rounded-xl shadow-2xl space-y-4">
      <div class="flex justify-between items-center pb-3 border-b border-neutral-100 dark:border-neutral-800">
        <h3 class="font-serif text-lg font-medium text-neutral-900 dark:text-neutral-100">Enquiry Overview</h3>
        <button type="button" onclick="DashboardMessages.closeModal('message-detail-modal')" class="text-neutral-400 hover:text-neutral-900 dark:hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div id="message-detail-content"></div>
    </div>
  </div>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/dashboard-messages.js"></script>
</body>
</html>
