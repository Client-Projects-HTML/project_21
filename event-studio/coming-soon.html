<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>Coming Soon | Frame & Fable Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { charcoal: '#102A43', ivory: '#F8ECD6', accent: '#D69D30' } },
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Early Theme & RTL Restore Script to prevent FOUC -->
  <script>
    (function() {
      const theme = localStorage.getItem('studioTheme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const rtl = localStorage.getItem('studioRTL');
      if (rtl === 'rtl' || rtl === 'true') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    })();
  </script>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-brand-ivory/30 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 transition-colors duration-300 relative overflow-x-hidden">

  <!-- Main Compact Luxury Card Container -->
  <main class="w-full max-w-lg bg-white/95 dark:bg-neutral-900/90 border border-neutral-200/80 dark:border-neutral-800 rounded-2xl p-5 sm:p-7 shadow-2xl backdrop-blur-xl relative z-10 transition-all my-auto">

    <!-- Card Header Bar: Logo on Left, Theme & RTL Controls on Right -->
    <div class="flex items-center justify-between pb-3.5 mb-5 border-b border-neutral-200/80 dark:border-neutral-800/80 gap-3">
      <!-- Logo -->
      <a href="index.html" class="flex items-center gap-2 group focus:outline-none focus:ring-2 focus:ring-amber-500 rounded-md">
        <div class="w-7 h-7 sm:w-8 sm:h-8 bg-brand-charcoal text-brand-ivory dark:bg-brand-ivory dark:text-brand-charcoal flex items-center justify-center rounded-full font-serif font-bold text-xs sm:text-base group-hover:scale-105 transition-transform shadow-sm flex-shrink-0">
          F
        </div>
        <div class="flex flex-col">
          <span class="font-serif text-xs sm:text-sm tracking-wider font-semibold uppercase text-brand-charcoal dark:text-brand-ivory leading-tight">Frame & Fable</span>
          <span class="text-[7px] sm:text-[8px] tracking-[0.2em] text-neutral-500 dark:text-neutral-400 uppercase font-sans">Studio</span>
        </div>
      </a>

      <!-- Right Controls: Theme Toggle + RTL Toggle -->
      <div class="flex items-center gap-1.5">
        <!-- Theme Toggle Button -->
        <button type="button" class="theme-toggle-btn w-8 h-8 border border-neutral-200 dark:border-neutral-800 bg-neutral-100 dark:bg-neutral-800/80 text-neutral-700 dark:text-neutral-200 hover:bg-neutral-200 dark:hover:bg-neutral-700 rounded-lg flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500" aria-label="Toggle theme" title="Toggle theme">
          <i data-lucide="sun" class="theme-sun w-3.5 h-3.5 hidden"></i>
          <i data-lucide="moon" class="theme-moon w-3.5 h-3.5"></i>
        </button>
        
        <!-- RTL Toggle Button -->
        <button type="button" class="rtl-toggle-btn w-8 h-8 border border-neutral-200 dark:border-neutral-800 bg-neutral-100 dark:bg-neutral-800/80 text-neutral-700 dark:text-neutral-200 hover:bg-neutral-200 dark:hover:bg-neutral-700 rounded-lg flex items-center justify-center transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500" aria-label="Toggle RTL" title="Toggle RTL">
          <i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </div>

    <!-- Card Content -->
    <div class="text-center space-y-4">
      <div class="inline-block">
        <span class="text-[10px] uppercase tracking-[0.2em] font-mono text-amber-700 dark:text-amber-400 px-3 py-1 rounded-full border border-amber-500/30 bg-amber-500/10 font-semibold">
          NEW EDITION REVEAL
        </span>
      </div>

      <h1 class="font-serif text-2xl sm:text-3xl font-normal leading-tight text-neutral-900 dark:text-white">
        Something Extraordinary <br>
        <span class="italic text-amber-600 dark:text-amber-400">Is In The Lens.</span>
      </h1>

      <p class="text-neutral-600 dark:text-neutral-300 text-xs sm:text-sm max-w-md mx-auto font-light leading-relaxed">
        We are unveiling our 2027 visual film archives and private destination wedding bookings suite shortly.
      </p>

      <!-- Countdown timer UI -->
      <div class="grid grid-cols-4 gap-2.5 max-w-sm mx-auto pt-1">
        <div class="p-2 sm:p-2.5 bg-neutral-100/80 dark:bg-neutral-800/60 border border-neutral-200/80 dark:border-neutral-700/60 rounded-lg">
          <span class="font-serif text-xl sm:text-2xl font-bold block text-amber-600 dark:text-amber-400">14</span>
          <span class="text-[8px] sm:text-[9px] uppercase tracking-widest text-neutral-500 dark:text-neutral-400 font-semibold">Days</span>
        </div>
        <div class="p-2 sm:p-2.5 bg-neutral-100/80 dark:bg-neutral-800/60 border border-neutral-200/80 dark:border-neutral-700/60 rounded-lg">
          <span class="font-serif text-xl sm:text-2xl font-bold block text-amber-600 dark:text-amber-400">08</span>
          <span class="text-[8px] sm:text-[9px] uppercase tracking-widest text-neutral-500 dark:text-neutral-400 font-semibold">Hours</span>
        </div>
        <div class="p-2 sm:p-2.5 bg-neutral-100/80 dark:bg-neutral-800/60 border border-neutral-200/80 dark:border-neutral-700/60 rounded-lg">
          <span class="font-serif text-xl sm:text-2xl font-bold block text-amber-600 dark:text-amber-400">42</span>
          <span class="text-[8px] sm:text-[9px] uppercase tracking-widest text-neutral-500 dark:text-neutral-400 font-semibold">Mins</span>
        </div>
        <div class="p-2 sm:p-2.5 bg-neutral-100/80 dark:bg-neutral-800/60 border border-neutral-200/80 dark:border-neutral-700/60 rounded-lg">
          <span class="font-serif text-xl sm:text-2xl font-bold block text-amber-600 dark:text-amber-400">18</span>
          <span class="text-[8px] sm:text-[9px] uppercase tracking-widest text-neutral-500 dark:text-neutral-400 font-semibold">Secs</span>
        </div>
      </div>

      <!-- Email Signup -->
      <form id="notify-form" class="max-w-sm mx-auto flex flex-col sm:flex-row gap-2 pt-2">
        <input type="email" placeholder="Enter your email address" required class="flex-1 px-3.5 py-2 rounded-lg bg-neutral-100 dark:bg-neutral-800/80 border border-neutral-300 dark:border-neutral-700 text-neutral-900 dark:text-white placeholder-neutral-500 dark:placeholder-neutral-400 text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
        <button type="submit" class="px-5 py-2 bg-brand-charcoal text-brand-ivory dark:bg-brand-ivory dark:text-brand-charcoal text-[11px] uppercase font-semibold tracking-wider rounded-lg hover:opacity-90 transition-opacity shadow-sm">
          Notify Me
        </button>
      </form>

      <!-- Back to Home Button (Below Email Address) -->
      <div class="pt-2 flex items-center justify-center">
        <a href="index.html" class="inline-flex items-center justify-center gap-1.5 px-6 py-2.5 bg-brand-charcoal text-brand-ivory dark:bg-brand-ivory dark:text-brand-charcoal hover:opacity-90 text-[11px] uppercase tracking-[0.18em] font-semibold rounded-lg shadow-md transition-all focus:outline-none focus:ring-2 focus:ring-amber-500">
          <i data-lucide="home" class="w-3.5 h-3.5"></i>
          <span>Back to Home</span>
        </a>
      </div>
    </div>

    <!-- Developed By Footer Credit -->
    <div class="pt-4 mt-5 border-t border-neutral-200/80 dark:border-neutral-800/80 text-[11px] text-neutral-500 dark:text-neutral-400 text-center">
      <div class="flex items-center justify-center gap-1 font-medium">
        <span>Developed by</span>
        <span class="font-semibold text-neutral-800 dark:text-neutral-200">Abhivorn Technologies Pvt. Ltd.</span>
      </div>
    </div>

  </main>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('notify-form')?.addEventListener('submit', (e) => {
      e.preventDefault();
      showToast('Thank you! You will be notified upon our new edition release.', 'success');
      e.target.reset();
    });
  </script>
</body>
</html>
