<!DOCTYPE html>
<html lang="en" dir="ltr" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <title>Frame Not Found | Frame & Fable Studio</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: { brand: { charcoal: '#102A43', ivory: '#F8ECD6', accent: '#D69D30' } },
          fontFamily: { serif: ['"Playfair Display"', 'serif'], sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark-mode.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <!-- Early Theme & RTL Restore Script -->
  <script>
    (function() {
      const theme = localStorage.getItem('studioTheme');
      if (theme === 'dark' || (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      const rtl = localStorage.getItem('studioRTL');
      if (rtl === 'rtl' || rtl === 'true') {
        document.documentElement.dir = 'rtl';
      } else {
        document.documentElement.dir = 'ltr';
      }
    })();
  </script>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 sm:p-6 bg-brand-ivory/30 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 transition-colors duration-300 relative overflow-x-hidden">

  <!-- Top Bar: Logo on Left, Theme & RTL Controls on Right (Outside Card) -->
  <header class="w-full max-w-5xl mx-auto flex items-center justify-between py-2 px-2 sm:px-4">
    <!-- Logo -->
    <a href="index.html" class="flex items-center gap-2 group focus:outline-none focus:ring-2 focus:ring-amber-500 rounded-md">
      <div class="w-8 h-8 sm:w-9 sm:h-9 bg-brand-charcoal text-brand-ivory flex items-center justify-center rounded-full font-serif font-bold text-xs sm:text-base group-hover:scale-105 transition-transform shadow-sm flex-shrink-0">
        F
      </div>
      <div class="flex flex-col">
        <span class="font-serif text-sm sm:text-base tracking-wider font-semibold uppercase text-brand-charcoal dark:text-brand-ivory leading-tight">Frame & Fable</span>
        <span class="text-[8px] sm:text-[9px] tracking-[0.2em] text-neutral-500 dark:text-neutral-400 uppercase font-sans">Studio</span>
      </div>
    </a>

    <!-- Right Controls: Theme Toggle + RTL Toggle -->
    <div class="flex items-center gap-2">
      <!-- Theme Toggle Button -->
      <button type="button" class="theme-toggle-btn w-9 h-9 border border-neutral-200 dark:border-neutral-800 bg-white/80 dark:bg-neutral-900/80 text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 rounded-lg flex items-center justify-center transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 shadow-sm" aria-label="Toggle theme" title="Toggle theme">
        <i data-lucide="sun" class="theme-sun w-4 h-4 hidden"></i>
        <i data-lucide="moon" class="theme-moon w-4 h-4"></i>
      </button>
      
      <!-- RTL Toggle Button -->
      <button type="button" class="rtl-toggle-btn w-9 h-9 border border-neutral-200 dark:border-neutral-800 bg-white/80 dark:bg-neutral-900/80 text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 rounded-lg flex items-center justify-center transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-amber-500 shadow-sm" aria-label="Toggle RTL" title="Toggle RTL">
        <i data-lucide="arrow-left-right" class="w-4 h-4"></i>
      </button>
    </div>
  </header>

  <!-- Main Compact Luxury Card Container -->
  <main class="w-full max-w-lg mx-auto bg-white/95 dark:bg-neutral-900/90 border border-neutral-200/80 dark:border-neutral-800 rounded-2xl p-6 sm:p-8 shadow-2xl backdrop-blur-xl relative z-10 transition-all my-auto">

    <!-- Card Content -->
    <div class="text-center space-y-4">
      <span class="font-mono text-5xl sm:text-7xl font-extralight text-amber-600 dark:text-amber-400 tracking-widest block">404</span>
      
      <h1 class="font-serif text-2xl sm:text-3xl font-normal text-neutral-900 dark:text-white">Frame Not Found</h1>
      
      <p class="text-neutral-600 dark:text-neutral-300 text-xs sm:text-sm max-w-sm mx-auto font-light leading-relaxed">
        The moment you're looking for may have moved or no longer exists in our visual archive.
      </p>

      <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
        <a href="index.html" class="w-full sm:w-auto px-6 py-2.5 bg-brand-charcoal text-brand-ivory dark:bg-brand-charcoal dark:text-brand-ivory hover:opacity-90 text-[11px] uppercase tracking-[0.18em] font-semibold rounded-lg shadow-md transition-all flex items-center justify-center gap-1.5 border border-transparent dark:border-neutral-700/60">
          <i data-lucide="home" class="w-3.5 h-3.5"></i>
          <span>Back to Home</span>
        </a>
        <a href="portfolio.html" class="w-full sm:w-auto px-6 py-2.5 border border-neutral-300 dark:border-neutral-700 text-neutral-700 dark:text-neutral-200 hover:bg-neutral-100 dark:hover:bg-neutral-800 text-[11px] uppercase tracking-[0.18em] font-semibold rounded-lg transition-all">
          View Portfolio
        </a>
      </div>
    </div>

  </main>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
