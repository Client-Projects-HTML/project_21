<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.4"/>
  <!-- Camera Frame & Lens Symbol -->
  <g transform="translate(12, 14)">
    <!-- Camera Body -->
    <path d="M 6 10 C 6 7.79 7.79 6 10 6 L 14 6 L 16 3 C 16.6 2.1 17.6 1.5 18.7 1.5 L 21.3 1.5 C 22.4 1.5 23.4 2.1 24 3 L 26 6 L 30 6 C 32.21 6 34 7.79 34 10 L 34 26 C 34 28.21 32.21 30 30 30 L 10 30 C 7.79 30 6 28.21 6 26 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lens Outer Ring -->
    <circle cx="20" cy="18" r="8" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
    <!-- Lens Center Aperture -->
    <circle cx="20" cy="18" r="4" fill="url(#goldGrad)" />
    <!-- Flash Light Dot -->
    <circle cx="28" cy="10" r="1.5" fill="#f59e0b" filter="url(#glow)" />
  </g>
</svg>
